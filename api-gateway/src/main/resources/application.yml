server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  http:
    codecs:
      max-in-memory-size: 64KB
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios
              uri: ${USUARIOS_URI:lb://ms-usuarios}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios/**
            - id: usuarios-swagger
              uri: ${USUARIOS_URI:lb://ms-usuarios}
              predicates:
                - Path=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**
eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
