server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: ms-usuarios
              uri: lb://ms-usuarios
              predicates:
                - Path=/usuarios/**
            - id: ms-instalaciones
              uri: lb://ms-instalaciones
              predicates:
                - Path=/regiones/**,/comunas/**,/instalaciones/**,/tipos-equipo/**,/equipos/**
            - id: ms-instrumentos
              uri: lb://ms-instrumentos
              predicates:
                - Path=/instrumentos/**
            - id: ms-protocolo
              uri: lb://ms-protocolo
              predicates:
                - Path=/visitas/**,/protocolos/**,/tipos-prueba/**,/evidencias/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
