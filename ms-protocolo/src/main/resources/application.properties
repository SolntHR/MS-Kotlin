spring.application.name=ms-protocolo
server.port=8084

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/induztek_protocolos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.error.include-message=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.evidencias.directorio=${EVIDENCIAS_DIR:uploads/evidencias}

springdoc.swagger-ui.path=/swagger-ui.html

servicios.usuarios.url=${USUARIOS_URL:http://ms-usuarios}
servicios.instalaciones.url=${INSTALACIONES_URL:http://ms-instalaciones}
servicios.instrumentos.url=${INSTRUMENTOS_URL:http://ms-instrumentos}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
